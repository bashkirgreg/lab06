name: CI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cpack_generators: "DEB;RPM"
          - os: macos-latest
            cpack_generators: "DragNDrop"
          - os: windows-latest
            cpack_generators: "WIX"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install RPM tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y rpm
    
    - name: Setup .NET (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    
    - name: Install WIX (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        dotnet tool install --global wix --version 4.0.0
        wix extension add --global WixToolset.UI.wixext/4.0.4
    
    - name: Configure CMake
      run: cmake -H. -B_build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build _build --config Release
    
    - name: Create packages
      shell: bash
      run: |
        cd _build
        IFS=';' read -ra GENERATORS <<< "${{ matrix.cpack_generators }}"
        for generator in "${GENERATORS[@]}"; do
          echo "Creating package with generator: $generator"
          cpack -G "$generator" -C Release
        done
        cd ..
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          _build/*.deb
          _build/*.rpm
          _build/*.dmg
          _build/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
